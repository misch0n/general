name: Test & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the GitHub Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel in-progress production runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 matches the version the project is developed and verified on.
          # It also removes any doubt about `node --test`'s default file
          # discovery reaching test/server/ — a subdirectory of test/.
          node-version: 22
          cache: npm
      # The engine/protocol suites are dependency-free, but the server's socket
      # tests need `ws` (a runtime dependency, not a dev one). Installing only
      # production deps keeps this job fast — it deliberately does NOT pull
      # puppeteer; the browser smoke is a local/manual step (see CLAUDE.md).
      - name: Install server dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Run unit tests
        run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the site; index.html + game.js are static.
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
